[workspace]
resolver = "3"
members = ["k99-landfill", "k99-sandfill", "k99-secfill"]

[workspace.dependencies]
nix = { version = "^0.31.3", default-features = false, features = ["process"] }
lexopt = { version = "^0.3.2" }
toml = { version = "^1.1.4" }
serde = { version = "^1.0.229", features = ["derive"] }
thiserror = { version = "^2.0.20" }
